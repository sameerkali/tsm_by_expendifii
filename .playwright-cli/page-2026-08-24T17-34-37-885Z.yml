              - button "How quickly can we get started?" [ref=e365] [cursor=pointer]
              - region "How quickly can we get started?":
                - generic: Most transporters are up and running within 2 to 24 hours. We help you set up your account, add your customers, and print your first GR together.
            - generic [ref=e370]:
              - button "Can we customise what appears on the printed GR?" [ref=e371] [cursor=pointer]
              - region "Can we customise what appears on the printed GR?":
                - generic: Yes. You choose which fields appear on print. Every transport business is different TSM works around your format, not a fixed template.
            - generic [ref=e376]:
              - button "Is TSM free?" [ref=e377] [cursor=pointer]
              - region "Is TSM free?":
                - generic: Yes TSM is completely free right now. We're onboarding our first transporters, gathering real feedback, and improving the product. After the free period, it will become a paid service but we'll always give you fair notice before anything changes.
            - generic [ref=e382]:
              - button "What is a Transport Management System (TMS)?" [ref=e383] [cursor=pointer]
              - region "What is a Transport Management System (TMS)?":
                - generic: A Transport Management System (TMS) is software that helps logistics companies plan, execute, and optimise the movement of goods. TSM by Expendifii focuses specifically on GR creation, printing, and record-keeping for Indian transporters — no complex modules you don't need.
            - generic [ref=e388]:
              - button "What happens when the free period ends?" [ref=e389] [cursor=pointer]
              - region "What happens when the free period ends?":
                - generic: We will notify you well in advance. Early adopters may get extended access or special pricing. No surprises.
            - generic [ref=e394]:
              - button "Do you offer on-premise deployment?" [ref=e395] [cursor=pointer]
              - region "Do you offer on-premise deployment?":
                - generic: Not currently. TSM by Expendifii is cloud-based, which means you can access it from anywhere with an internet connection.
          - generic [ref=e400]:
            - generic [ref=e401]:
              - button "We've been doing this on paper for years. Is it hard to switch?" [ref=e402] [cursor=pointer]
              - region "We've been doing this on paper for years. Is it hard to switch?":
                - generic: Not at all. TSM was designed for transporters, not software people. If you can fill a paper GR, you can use TSM. Most users are comfortable within a day.
            - generic [ref=e407]:
              - button "What happens to our data if something goes wrong?" [ref=e408] [cursor=pointer]
              - region "What happens to our data if something goes wrong?":
                - generic: Your data is stored securely on our servers not on paper, not on a single computer. It won't burn, won't get soaked, won't be eaten by rats. It's always there when you need it.
            - generic [ref=e413]:
              - button "Do you have a referral programme?" [ref=e414] [cursor=pointer]
              - region "Do you have a referral programme?":
                - generic: Yes. Refer a fellow transporter and if they purchase a plan, both of you get 15 extra days free. No catch.
            - generic [ref=e419]:
              - button "Is TSM suitable for small fleets with just 1-2 trucks?" [ref=e420] [cursor=pointer]
              - region "Is TSM suitable for small fleets with just 1-2 trucks?":
                - generic: Absolutely. TSM is designed for transporters of all sizes. Whether you own one truck or fifty, the GR creation, customer management, and analytics features work exactly the same. Small fleet owners actually benefit the most because TSM eliminates the need to hire a dedicated person just for paperwork.
            - generic [ref=e425]:
              - button "Can I export my data if I leave?" [expanded] [ref=e426] [cursor=pointer]
              - region "Can I export my data if I leave?" [ref=e431]:
                - generic [ref=e432]: Yes. You can export all your GRs and customer data anytime. Your data belongs to you.
